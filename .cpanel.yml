---
deployment:
  tasks:
    # 1) Belge kökü (document root). cPanel > Domains'te yoji.com.tr'nin "Document Root" değerine bak.
    #    ANA DOMAIN ise aşağıdaki satır doğrudur (public_html).
    #    ADDON/eklenti domain ise bu satırı şununla değiştir:
    #        - export DEPLOYPATH="$HOME/public_html/yoji.com.tr/"
    #    ($HOME zaten /home/<cpanel_kullanıcı_adın> demektir; kullanıcı adını yazmana gerek yok.)
    - export DEPLOYPATH="$HOME/public_html/"
    # 2) Repoyu public_html'e birebir aynalar: repoda olmayanları SİLER (--delete).
    #    .git, deploy dosyaları ve sunucudaki .htaccess korunur.
    - /usr/bin/rsync -a --delete --exclude='.git' --exclude='.gitignore' --exclude='.cpanel.yml' --exclude='README.md' --exclude='.htaccess' ./ "$DEPLOYPATH"
