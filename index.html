<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YO-Jİ | Frozen Yogurt & Açaí</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            /* Açaí ve meyve hissi veren canlı, ferah bir degrade arka plan */
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            color: #2d3436;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Meyvemsi renk dalgaları (Açaí moru ve orman meyvesi pembesi) */
        .fruit-blob-1 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(138, 43, 226, 0.15) 0%, transparent 70%);
            top: -100px;
            left: -100px;
            border-radius: 50%;
            z-index: 0;
        }

        .fruit-blob-2 {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(216, 27, 96, 0.1) 0%, transparent 70%);
            bottom: -150px;
            right: -100px;
            border-radius: 50%;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 650px;
            width: 90%;
            text-align: center;
            padding: 60px 40px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(12px);
        }

        .logo {
            max-width: 250px;
            margin-bottom: 20px;
        }

        .tagline {
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: #8e44ad; /* Açaí moru vurgu */
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 2.5rem;
            line-height: 1.2;
            margin-bottom: 20px;
            font-weight: 800;
            color: #1a1a1a;
        }

        p {
            font-size: 1.15rem;
            color: #636e72;
            margin-bottom: 35px;
            line-height: 1.6;
        }

        /* E-posta formunun yerine geçen, trafiği boşa harcamayacak Sosyal Medya eylem çağrısı */
        .social-cta {
            display: inline-block;
            text-decoration: none;
            background: linear-gradient(45deg, #8e44ad, #d81b60);
            color: white;
            padding: 16px 35px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 10px 20px rgba(142, 68, 173, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .social-cta:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(142, 68, 173, 0.4);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            .container {
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="fruit-blob-1"></div>
    <div class="fruit-blob-2"></div>
    
    <div class="container">
        <!-- Yo-Ji Logosu -->
        <img src="yoji.png" alt="YO-Jİ Logo" class="logo">
        
        <div class="tagline">Çok Yakında</div>
        
        <h1>YOJI. HAYATIN TADI.</h1>
        <p>Hayatta yeterince ciddiye almamız gereken şey var.<br>Yoji, Tüm bunlara küçük bir mola.<br><br>Bir kap.<br>Sevdiğin tatlar.<br>Keyfine göre lezzet.</p>
        
        <!-- Mail toplamak istemiyorsan, müşteriyi Instagram'a çekeceksin. Linki kendi hesabınla değiştir. -->
        <a href="https://www.instagram.com/yojifrozen/" class="social-cta" target="_blank">Instagram'da Bizi Takip Et</a>
    </div>
    
    
    
<!-- ============================================================
     YO-JI · Açılış popup'ı (her ziyaretçiye, her girişte)
     Kullanım: Bu bloğun tamamını footer.php içinde </body>'den
     hemen ÖNCE yapıştırın. Görseli yükleyin ve YJ_POPUP_IMG yolunu
     kendi görsel adresinizle değiştirin.
     ============================================================ -->
<div id="yj-popup" class="yj-popup" role="dialog" aria-modal="true" aria-label="Yo-Ji Caddebostan yakında açılıyor" hidden>
  <div class="yj-popup__backdrop" data-yj-close></div>
  <div class="yj-popup__box">
    <button type="button" class="yj-popup__close" data-yj-close aria-label="Kapat">&times;</button>
    <a class="yj-popup__link" href="#">
      <img src="/img/popup.jpg"
           alt="Yo-Ji Caddebostan yakında açılıyor"
           class="yj-popup__img" width="1024" height="1024">
    </a>
  </div>
</div>

<style>
  .yj-popup{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px}
  .yj-popup[hidden]{display:none}
  .yj-popup__backdrop{position:absolute;inset:0;background:rgba(30,20,25,.72);backdrop-filter:blur(3px);animation:yjFade .3s ease}
  .yj-popup__box{position:relative;z-index:1;max-width:min(92vw,480px);width:100%;animation:yjPop .35s cubic-bezier(.2,.9,.3,1.2)}
  .yj-popup__link{display:block;line-height:0}
  .yj-popup__img{width:100%;height:auto;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.4);display:block}
  .yj-popup__close{position:absolute;top:-14px;right:-14px;width:40px;height:40px;border:0;border-radius:50%;
    background:#fff;color:#1d1a1a;font-size:26px;line-height:38px;text-align:center;cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:2;transition:transform .15s}
  .yj-popup__close:hover{transform:scale(1.08)}
  @keyframes yjFade{from{opacity:0}to{opacity:1}}
  @keyframes yjPop{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:none}}
  @media(max-width:520px){.yj-popup__close{top:-10px;right:-10px;width:36px;height:36px;font-size:24px;line-height:34px}}
  @media(prefers-reduced-motion:reduce){.yj-popup__backdrop,.yj-popup__box{animation:none}}
  body.yj-popup-open{overflow:hidden}
</style>

<script>
(function () {
  var pop = document.getElementById('yj-popup');
  if (!pop) return;

  function open() {
    pop.hidden = false;
    document.body.classList.add('yj-popup-open');
    document.addEventListener('keydown', onKey);
  }
  function close() {
    pop.hidden = true;
    document.body.classList.remove('yj-popup-open');
    document.removeEventListener('keydown', onKey);
  }
  function onKey(e) { if (e.key === 'Escape') close(); }

  /* Kapat düğmesine, çarpıya ve arka plana tıklayınca kapan (görsele tıklayınca kapanmaz, linke gider) */
  pop.querySelectorAll('[data-yj-close]').forEach(function (el) {
    el.addEventListener('click', close);
  });

  /* Her girişte göster. Sayfa açılır açılmaz göstermek için setTimeout'u 0 yapabilir,
     ya da birkaç saniye beklemek için 1500 gibi bir değer verebilirsiniz. */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { setTimeout(open, 600); });
  } else {
    setTimeout(open, 600);
  }
})();
</script>
<!-- ======================= YO-JI popup sonu ======================= -->

</body>
</html>
